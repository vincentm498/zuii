name: Root Version Bump

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  bump:
    name: Bump and publish zuii
    if: "!contains(github.event.head_commit.message, 'chore: bump version') && !contains(github.event.head_commit.message, 'chore: version packages')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: pnpm install

      - name: Bump patch version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            const [major, minor, patch] = pkg.version.split('.').map(Number);
            pkg.version = major + '.' + minor + '.' + (patch + 1);
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "

      - name: Commit, open PR and merge
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="version-bump/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore: bump version to $VERSION"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: bump version to $VERSION" --body "Bump automatique de version."
          gh pr merge "$BRANCH" --merge --admin --delete-branch --subject "chore: bump version to $VERSION [skip ci]"

      - name: Build
        run: pnpm run build

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish zuii
        run: npm publish --access public
